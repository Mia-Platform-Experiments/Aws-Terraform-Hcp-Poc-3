apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: default-ingress
  labels:
    app.kubernetes.io/instance: "ingress-controller"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`aws-terraform-hcp-poc-3-test.mia-demo-re5gu6.gcp.mia-platform.eu`)
      middlewares:
        - name: "ingress-controller-hsts-headers"
          namespace: ingress-system
      kind: Rule
      services:
        - name: api-gateway
          port: 8080
